name: RaceDay API - Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  PROJECT_FILE: RaceDay.API.csproj   # ← EDIT: your .sln or .csproj file name

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          for path in Data Dtos Models Services Migrations README.md; do
            if [ -e "$path" ]; then
              echo "OK: $path found"
            else
              echo "MISSING: $path"
              exit 1
            fi
          done

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore "$RaceDay.API.csproj"

      - name: Build
        run: dotnet build "$RaceDay.API.csproj" --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test "$RaceDay.API.csproj" --no-build --configuration Release
